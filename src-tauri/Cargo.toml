[package]
name = "kwdiff"
version = "0.1.0"
description = "Review changes across branches that share no ancestor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kwdiff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "io-util", "rt-multi-thread", "macros"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
default = []
