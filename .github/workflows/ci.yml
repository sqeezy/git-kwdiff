name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: no devtools overlay in the bundle
        run: |
          # The runtime mentions `foldkit-devtools` as an element id; the overlay
          # itself registers `__setDevToolsOverlay`. Only the latter shipping is a leak.
          if grep -rq "__setDevToolsOverlay" dist; then
            echo "devtools overlay leaked into dist"; exit 1
          fi

  desktop:
    name: desktop (tauri build, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: build installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kwdiff-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
